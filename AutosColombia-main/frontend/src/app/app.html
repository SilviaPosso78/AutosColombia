<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Autos Colombia, inicio">
      <span class="brand-name">Autos<br />Colombia</span>
      <span class="brand-description">
        Un espacio para organizar el movimiento de vehículos y mantener la información a mano.
      </span>
    </a>
    <div class="header-content">
      <nav aria-label="Navegación principal">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >Inicio</a
        >
        <a routerLink="/control-acceso" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Control de acceso</a
        >
        <a routerLink="/gestion/operadores" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Operadores</a
        >
        <a routerLink="/gestion/celdas" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Celdas</a
        >
        <a routerLink="/gestion/vehiculos" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Vehículos</a
        >
      </nav>
      <p class="header-message">Registra entradas, consulta vehículos y confirma salidas.</p>
    </div>
  </header>
  <main><router-outlet /></main>
  <footer class="site-footer">
    <span>Autos Colombia</span>
    <span>Control vehicular con claridad.</span>
  </footer>
</div>
